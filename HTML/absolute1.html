<!DOCTYPE html>
<html>
    <head>
        <title>Absolute Position</title>
        <style>
            .common{
                width: 100px;
                height: 100px;
                border: 1px solid gray;
                color: white;
                font-weight: bold;
            }
            .c1{
                background-color: red;
            }
            .c2{
                background-color: green;
                position: absolute;
                left: 30px;
                top:30px   
            }
            .c3{
                background-color: blue;
                position: absolute;
                left: 60px;
                top: 60px;
            }
            .c4{
                background-color: orange;
                position: absolute;
                left: 90px;
                top: 90px;
            }
            .c5{
                background-color: gray;
                position: absolute;
                left: 120px;
                top:120px
            }
        </style>
    </head>
    <body>
        <div class="common c1">Div1</div>
        
        <div class="common c2">Div2</div>
        
        <div class="common c3">Div3</div>
        
        <div class="common c4">Div4</div>
        
        <div class="common c5">Div5</div>
    </body>
</html>
