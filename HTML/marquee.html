<!DOCTYPE html>
<html>
    <head>
        <title>Marquee Example</title>
    </head>
    <body>
        <marquee>
            <h1>Hello</h1>
        </marquee>

        <marquee direction="right">
            <h1>Hello</h1>
        </marquee>

        <marquee direction="up">
            <h1>Hello</h1>
        </marquee>

        <marquee direction="down">
            <h1>Hello</h1>
        </marquee>

        <marquee width="50%">
            <h1>Hello</h1>
        </marquee>

        <marquee scrollamount="200">
            <h1>Hello</h1>
        </marquee>
    </body>
</html>
