<!DOCTYPE html>
<html>
    <head>
        <title>Images</title>
        <style>
            img{
               border: 1px solid gray;
               padding: 20px;
               margin: 20px;
               border-radius: 30px; 
            }
            .c1:hover{
                border: 10px solid red
                
            }
            #id1:hover{
                width: 150px;
                height: 150px;
                border: 5px solid green;
                border-radius: 100%;
            }
            .c2:hover{
                display: none;
            }
        </style>
    </head>
    <body>
        <img src="flipkart.png" alt="Flipkart" class="c1">
        <img src="amazon.png" alt="Amazon" id="id1">
        <img src="myntra.png" alt="Myntra" class="c2">
    </body>
</html>
